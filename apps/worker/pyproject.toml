[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgebrook-worker"
version = "0.1.0"
description = "Python worker boilerplate for Ledgebrook interview practice"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

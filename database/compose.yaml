services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ledgebrook}
      POSTGRES_USER: ${POSTGRES_USER:-ledgebrook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgebrook}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 10
    volumes:
      - ledgebrook-postgres-data:/var/lib/postgresql/data

volumes:
  ledgebrook-postgres-data:
